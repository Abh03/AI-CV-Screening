x-runtime: &runtime
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT: production
  STAGE2_BACKEND: postgres
  ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY:?Set ENCRYPTION_SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  API_TOKENS_JSON: ${API_TOKENS_JSON:-}
  LLM_PROVIDER: ${LLM_PROVIDER:?Set LLM_PROVIDER}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  CAMPAIGN_STAGE3_GLOBAL_INFLIGHT: ${CAMPAIGN_STAGE3_GLOBAL_INFLIGHT:-2}
  PROVIDER_REQUESTS_PER_MINUTE: ${PROVIDER_REQUESTS_PER_MINUTE:-60}
  PROVIDER_TOKENS_PER_MINUTE: ${PROVIDER_TOKENS_PER_MINUTE:-120000}
  PROVIDER_TOKENS_PER_REQUEST: ${PROVIDER_TOKENS_PER_REQUEST:-6000}
  CAMPAIGN_STAGE3_MAX_ATTEMPTS: ${CAMPAIGN_STAGE3_MAX_ATTEMPTS:-5}
  CAMPAIGN_STAGE3_RETRY_BASE_SECONDS: ${CAMPAIGN_STAGE3_RETRY_BASE_SECONDS:-15}
  CAMPAIGN_STAGE3_RETRY_MAX_SECONDS: ${CAMPAIGN_STAGE3_RETRY_MAX_SECONDS:-900}

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: cv_engine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cv_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ..
      dockerfile: Dockerfile
    environment: *runtime
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "screening"]
    environment: *runtime
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  ocr-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "ocr"]
    environment: *runtime
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  control-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "control"]
    environment: *runtime
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  retrieval-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "retrieval"]
    environment: *runtime
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  evaluation-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "evaluation"]
    environment: *runtime
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment: *runtime
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
