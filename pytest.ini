[pytest]
filterwarnings =
    ignore::DeprecationWarning
    ignore::starlette.testclient.StarletteDeprecationWarning

markers =
    infrastructure: Requires running PostgreSQL and Redis services
    integration: Live integration tests that consume external API tokens (deselect with '-m "not integration"')
    worker: Requires a running Celery worker and PostgreSQL/Redis
    model: Downloads or loads embedding and reranker models
